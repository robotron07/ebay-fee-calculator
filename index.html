<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced eBay Fee Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Advanced eBay Fee Calculator</h1>

    <div class="form-group">
      <label for="salePrice">Sale Price ($):</label>
      <input type="number" id="salePrice" placeholder="Enter sale price" />
    </div>

    <div class="form-group">
      <label for="shippingCharged">Shipping Charged to Buyer ($):</label>
      <input type="number" id="shippingCharged" placeholder="Enter shipping charged" />
    </div>

    <div class="form-group">
      <label for="shippingCost">Your Shipping Cost ($):</label>
      <input type="number" id="shippingCost" placeholder="Enter actual shipping cost" />
    </div>

    <div class="form-group">
      <label for="itemCost">Cost of Goods Sold (Item Cost) ($):</label>
      <input type="number" id="itemCost" placeholder="What you paid for the item" />
    </div>

    <div class="form-group">
      <label for="ebayFeePercent">eBay Final Value Fee (%):</label>
      <input type="number" id="ebayFeePercent" value="13.25" step="0.01" />
    </div>

    <div class="form-group">
      <label for="fixedFee">Fixed Fee per Order ($):</label>
      <input type="number" id="fixedFee" value="0.30" step="0.01" />
    </div>

    <button onclick="calculateAdvancedProfit()">Calculate Profit</button>
    <button onclick="resetCalculator()" class="reset">Reset</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
